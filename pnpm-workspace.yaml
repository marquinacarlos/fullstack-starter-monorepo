packages:
  - "apps/*"
  - "packages/*"

# Single place for shared dependency versions. Packages use "catalog:".
catalog:
  typescript: ~6.0.3 # typescript-eslint does not support TS 7 yet
  "@types/node": ^24.19.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  react: ^19.3.1
  react-dom: ^19.3.1
  vite: ^8.3.5
  "@vitejs/plugin-react": ^6.1.2
  vitest: ^5.0.5
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  "@tailwindcss/postcss": ^4.3.3
  lucide-react: ^1.64.0
  zod: ^4.6.7
  axios: ^1.21.0
  zustand: ^5.0.16
  i18next: ^26.5.11
  react-i18next: ^17.1.9
  i18next-browser-languagedetector: ^8.2.3
  react-router-dom: ^7.18.5
  "@tanstack/react-query": ^5.105.0

minimumReleaseAgeExclude:
  - lucide-react@1.64.0

# Install scripts (native binaries). pnpm 11 reads `allowBuilds`.
# Only these packages may run postinstall; electron-winstaller is for
# Squirrel.Windows installers, which this template does not use (NSIS).
allowBuilds:
  electron: true # pnpm flags it (install.js); the binary itself downloads on first run
  esbuild: true
  sharp: true
  "@tailwindcss/oxide": true
  electron-winstaller: false
  # next-intl optional message-extraction tooling, not used here.
  "@parcel/watcher": false
  "@swc/core": false
