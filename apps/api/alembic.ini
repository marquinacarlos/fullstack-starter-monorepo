# One section per database, each with its own migrations folder and history.
#   alembic -n sqlite revision --autogenerate -m "message"
#   alembic -n postgres upgrade head
# `pnpm db:migrate` upgrades every database that is enabled and reachable.
# The database URL is not set here: it comes from Settings (env files / env vars).

[sqlite]
script_location = %(here)s/alembic/sqlite
prepend_sys_path = .
path_separator = os

[postgres]
script_location = %(here)s/alembic/postgres
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
