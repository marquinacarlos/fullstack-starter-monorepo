[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",  # scaffold:line db-layer
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",  # scaffold:line postgres
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",  # scaffold:line db-layer
    "strawberry-graphql[fastapi]>=0.339.0",  # scaffold:line graphql
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
