name: CI Desktop

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo. Jobs that publish must ask for more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron:
    name: Build Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - run: pnpm --filter @repo/desktop lint
      - run: pnpm --filter @repo/desktop test

      # Builds installers for this OS. --publish never: CI must not upload anything.
      - name: Build installers
        run: pnpm --filter @repo/desktop exec electron-vite build && pnpm --filter @repo/desktop exec electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # no code signing in CI

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: apps/desktop/release/*.*
          if-no-files-found: warn
