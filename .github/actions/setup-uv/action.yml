name: Setup uv
description: Install uv (with cache) and the API dependencies. uv provides the Python version from pyproject.toml.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: apps/api/uv.lock

    - run: uv sync --frozen
      shell: bash
      working-directory: apps/api
