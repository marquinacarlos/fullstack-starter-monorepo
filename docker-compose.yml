# PostgreSQL is OPTIONAL: the monorepo runs without it (SQLite is the default demo database).
# Start it with `pnpm db:up`. Development only; production hosting is out of scope.
# The defaults below match POSTGRES_URL in apps/api/.env.development, so no .env file is needed.
# To change POSTGRES_*, put them in a root .env (git-ignored) and update POSTGRES_URL
# in apps/api/.env.local.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: run the API in a container instead of `pnpm dev`.
  #   docker compose --profile api up -d
  api:
    profiles: ["api"]
    build: ./apps/api
    environment:
      # Only PostgreSQL in the container: SQLITE_URL is not set, so SQLite stays disabled.
      POSTGRES_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
